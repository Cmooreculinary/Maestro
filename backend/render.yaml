services:
  - type: web
    name: headmaster
    runtime: python
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt && cd frontend && npm ci && npm run build
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: NODE_VERSION
        value: 22.14.0
      - key: VAULT_ADAPTER
        value: mock
